<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Inner Glow Gold -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square / Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Stroke Frame -->
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="6" opacity="0.85" />
  <rect x="22" y="22" width="468" height="468" rx="90" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3" />

  <!-- Center Luxury Emblem Container -->
  <g transform="translate(256, 215)">
    <!-- Subtle Golden Halo Behind B -->
    <circle cx="0" cy="0" r="145" fill="#f59e0b" opacity="0.12" filter="url(#goldGlow)" />
    
    <!-- Outer Octagonal Shield -->
    <path d="M-120,-110 L120,-110 L140,-40 L140,40 L120,110 L-120,110 L-140,40 L-140,-40 Z" 
          fill="#090d16" stroke="url(#borderGrad)" stroke-width="5" />
    <path d="M-110,-100 L110,-100 L128,-36 L128,36 L110,100 L-110,100 L-128,36 L-128,-36 Z" 
          fill="#020617" stroke="#f59e0b" stroke-width="1.5" opacity="0.5" />

    <!-- Bold Stylized Letter B with Dimensional Cutouts -->
    <!-- Outer B shape -->
    <path d="M-60,-75 L15,-75 C52,-75 75,-58 75,-25 C75,0 55,14 32,20 C64,26 84,45 84,80 C84,116 55,135 10,135 L-60,135 Z" 
          fill="url(#goldGrad)" />
    
    <!-- Top inner cutout -->
    <path d="M-22,-45 L10,-45 C28,-45 42,-37 42,-22 C42,-7 28,1 10,1 L-22,1 Z" 
          fill="#020617" stroke="url(#borderGrad)" stroke-width="2" />
    
    <!-- Bottom inner cutout -->
    <path d="M-22,31 L14,31 C35,31 50,41 50,60 C50,78 35,90 14,90 L-22,90 Z" 
          fill="#020617" stroke="url(#borderGrad)" stroke-width="2" />

    <!-- Sharp Bevel Highlights on B -->
    <path d="M-60,-75 L-60,135 L-42,135 L-42,-57 L15,-57 C38,-57 58,-47 62,-30 L75,-25 C75,-58 52,-75 15,-75 Z" 
          fill="#ffffff" opacity="0.25" />
  </g>

  <!-- BETGURU Wordmark Ribbon -->
  <g transform="translate(256, 410)">
    <!-- Badge Background -->
    <rect x="-180" y="-24" width="360" height="48" rx="14" fill="#090d16" stroke="url(#borderGrad)" stroke-width="2" />
    
    <!-- Crown icon or Stars above wordmark -->
    <g transform="translate(0, -32) scale(0.9)">
      <polygon points="0,-10 -6,2 -18,2 -9,9 -12,20 0,13 12,20 9,9 18,2 6,2" fill="url(#goldLight)" />
      <polygon points="-45,-6 -49,3 -58,3 -51,8 -53,16 -45,11 -37,16 -39,8 -32,3 -41,3" fill="url(#goldLight)" opacity="0.8" />
      <polygon points="45,-6 41,3 32,3 39,8 37,16 45,11 53,16 51,8 58,3 49,3" fill="url(#goldLight)" opacity="0.8" />
    </g>

    <!-- BETGURU Text -->
    <text x="0" y="9" font-family="'Impact', 'Arial Black', -apple-system, sans-serif" font-size="30" font-weight="900" fill="url(#goldGrad)" letter-spacing="4" text-anchor="middle">
      BETGURU
    </text>
  </g>

  <!-- Bottom Tagline -->
  <text x="256" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#94a3b8" letter-spacing="3" text-anchor="middle">
    CASINO &amp; LOTTERY
  </text>
</svg>
