    <script>
      (function() {
        var isBenign = function(str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return s.indexOf('[vite]') !== -1 ||
                 s.indexOf('failed to connect to websocket') !== -1 ||
                 s.indexOf('pending promise was never set') !== -1 ||
                 s.indexOf('internal assertion failed') !== -1 ||
                 s.indexOf('could not reach cloud firestore backend') !== -1 ||
                 s.indexOf("backend didn't respond within 10 seconds") !== -1 ||
                 s.indexOf('the client will operate in offline mode') !== -1 ||
                 s.indexOf('the client is offline') !== -1 ||
                 s.indexOf('client is offline') !== -1;
        };
        var origErr = console.error;
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).map(function(a) {
            return typeof a === 'string' ? a : (a && a.message ? a.message : '');
          }).join(' ');
          if (isBenign(msg)) return;
          origErr.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          var msg = Array.prototype.slice.call(arguments).map(function(a) {
            return typeof a === 'string' ? a : (a && a.message ? a.message : '');
          }).join(' ');
          if (isBenign(msg)) return;
          origWarn.apply(console, arguments);
        };
      })();
    </script>
  </head>

  </body>
