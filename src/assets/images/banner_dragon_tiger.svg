<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Dragon Red to Tiger Amber/Navy -->
    <linearGradient id="dtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0505" />
      <stop offset="35%" stop-color="#120205" />
      <stop offset="70%" stop-color="#050a17" />
      <stop offset="100%" stop-color="#021426" />
    </linearGradient>

    <!-- Dragon Red Flame Gradient -->
    <linearGradient id="dragonFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d50000" />
      <stop offset="50%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#ff8a80" />
    </linearGradient>

    <!-- Tiger Amber Gold Gradient -->
    <linearGradient id="tigerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ff9100" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>

    <!-- Tie Green / Purple Gradient -->
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>

    <filter id="dragonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="tigerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadowDT" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#dtBg)" />

  <!-- Dragon Fire Aura Rays (Left) -->
  <g opacity="0.25" filter="url(#dragonGlow)">
    <circle cx="160" cy="240" r="140" fill="#d50000" />
    <path d="M 0 0 L 220 220 L 0 350 Z" fill="#ff1744" opacity="0.3" />
    <path d="M 50 450 L 200 240 L 0 450 Z" fill="#b71c1c" opacity="0.4" />
  </g>

  <!-- Tiger Thunder Aura Rays (Right) -->
  <g opacity="0.25" filter="url(#tigerGlow)">
    <circle cx="640" cy="240" r="140" fill="#ff9100" />
    <path d="M 800 0 L 580 220 L 800 350 Z" fill="#ffd54f" opacity="0.3" />
    <path d="M 750 450 L 600 240 L 800 450 Z" fill="#e65100" opacity="0.4" />
  </g>

  <!-- Lightning Bolt Divider in the Middle -->
  <path d="M 400 0 L 390 120 L 415 130 L 385 240 L 410 250 L 395 450" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.6" filter="url(#tigerGlow)" />

  <!-- Left Arena Section: DRAGON (Crimson Red) -->
  <g transform="translate(140, 240)">
    <!-- Dragon Card Frame -->
    <rect x="-80" y="-95" width="160" height="190" rx="18" fill="#1b0000" fill-opacity="0.75" stroke="#ff1744" stroke-width="2.5" filter="url(#cardShadowDT)" />
    
    <!-- Dragon Top Banner -->
    <rect x="-65" y="-85" width="130" height="34" rx="8" fill="#d50000" />
    <text x="0" y="-63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="2">
      DRAGON
    </text>
    
    <!-- Dragon Emblem Icon -->
    <text x="0" y="5" text-anchor="middle" font-size="52" filter="url(#dragonGlow)">
      🐉
    </text>

    <text x="0" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ff8a80">
      PAYOUT 1:1
    </text>

    <rect x="-60" y="60" width="120" height="22" rx="6" fill="#ff1744" fill-opacity="0.2" stroke="#ff1744" stroke-width="1" />
    <text x="0" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff">
      HIGHEST CARD WINS
    </text>
  </g>

  <!-- Right Arena Section: TIGER (Electric Amber) -->
  <g transform="translate(660, 240)">
    <!-- Tiger Card Frame -->
    <rect x="-80" y="-95" width="160" height="190" rx="18" fill="#160800" fill-opacity="0.75" stroke="#ff9100" stroke-width="2.5" filter="url(#cardShadowDT)" />
    
    <!-- Tiger Top Banner -->
    <rect x="-65" y="-85" width="130" height="34" rx="8" fill="#ff9100" />
    <text x="0" y="-63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#000000" letter-spacing="2">
      TIGER
    </text>
    
    <!-- Tiger Emblem Icon -->
    <text x="0" y="5" text-anchor="middle" font-size="52" filter="url(#tigerGlow)">
      🐅
    </text>

    <text x="0" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffe082">
      PAYOUT 1:1
    </text>

    <rect x="-60" y="60" width="120" height="22" rx="6" fill="#ff9100" fill-opacity="0.2" stroke="#ff9100" stroke-width="1" />
    <text x="0" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff">
      HIGHEST CARD WINS
    </text>
  </g>

  <!-- Center Arena Section: TIE & SUITED TIE -->
  <g transform="translate(400, 240)">
    <!-- Center Tie Frame -->
    <rect x="-65" y="-75" width="130" height="150" rx="14" fill="#001810" fill-opacity="0.85" stroke="#00e676" stroke-width="2" filter="url(#cardShadowDT)" />
    
    <!-- Tie 11:1 Box -->
    <rect x="-55" y="-65" width="110" height="45" rx="8" fill="#00e676" fill-opacity="0.2" stroke="#00e676" stroke-width="1" />
    <text x="0" y="-45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#00e676">
      TIE
    </text>
    <text x="0" y="-28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">
      11:1 PAYOUT
    </text>

    <!-- Suited Tie 50:1 Mega Box -->
    <rect x="-55" y="-5" width="110" height="55" rx="8" fill="url(#tieGrad)" filter="url(#cardShadowDT)" />
    <text x="0" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#000000">
      SUITED TIE
    </text>
    <text x="0" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#000000">
      50:1
    </text>
  </g>

  <!-- Header Branding and Title -->
  <g transform="translate(60, 75)">
    <!-- Tag -->
    <rect x="0" y="-22" width="155" height="28" rx="14" fill="#d50000" fill-opacity="0.2" stroke="#ff1744" stroke-width="1.5" />
    <circle cx="14" cy="-8" r="4" fill="#ff1744" filter="url(#dragonGlow)" />
    <text x="26" y="-4" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1">
      EVOLUTION LIVE HD
    </text>

    <!-- Main Title -->
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="0.5">
      DRAGON TIGER
    </text>
    
    <text x="0" y="58" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ff8a80">
      ⚔️ TWO CARDS BATTLE • 12 SECONDS ROUND
    </text>
  </g>
</svg>
