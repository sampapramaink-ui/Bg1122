<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Royal Emerald Gradient -->
    <radialGradient id="emeraldFelt" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a4d2e" />
      <stop offset="45%" stop-color="#063820" />
      <stop offset="85%" stop-color="#021f11" />
      <stop offset="100%" stop-color="#01120a" />
    </radialGradient>

    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="30%" stop-color="#ffd54f" />
      <stop offset="70%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#b26a00" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffd54f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>

    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>

    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c" />
      <stop offset="100%" stop-color="#5c0002" />
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Table Felt Diamond Pattern -->
    <pattern id="feltPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 30 15 L 15 30 L 0 15 Z" fill="none" stroke="#0e603b" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Table Background Felt -->
  <rect width="800" height="450" fill="url(#emeraldFelt)" />
  <rect width="800" height="450" fill="url(#feltPattern)" />

  <!-- Gold Ornate Arch / Border Lines -->
  <path d="M 40 40 L 760 40 L 760 410 L 40 410 Z" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" stroke-dasharray="8,4" />
  <path d="M 46 46 L 754 46 L 754 404 L 46 404 Z" fill="none" stroke="#ffd54f" stroke-width="0.5" stroke-opacity="0.4" />

  <!-- Left: ANDAR Side Betting Box -->
  <g transform="translate(100, 160)">
    <rect x="-10" y="-10" width="160" height="180" rx="14" fill="#000000" fill-opacity="0.45" stroke="#4caf50" stroke-width="2" stroke-dasharray="6,4" />
    <rect x="0" y="0" width="140" height="40" rx="8" fill="#1b5e20" stroke="#81c784" stroke-width="1" />
    <text x="70" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="2">
      ANDAR
    </text>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a5d6a7">
      Payout 1.90x
    </text>

    <!-- Andar Card Stack -->
    <g transform="translate(30, 85)" filter="url(#cardShadow)">
      <rect width="80" height="110" rx="6" fill="url(#cardBack)" stroke="#ffc107" stroke-width="1" />
      <!-- Ornate Card Pattern -->
      <rect x="6" y="6" width="68" height="98" rx="4" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="2,2" />
      <circle cx="40" cy="55" r="16" fill="#7f0000" stroke="#ffc107" stroke-width="0.75" />
      <text x="40" y="60" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#ffc107">A</text>
    </g>
  </g>

  <!-- Right: BAHAR Side Betting Box -->
  <g transform="translate(540, 160)">
    <rect x="-10" y="-10" width="160" height="180" rx="14" fill="#000000" fill-opacity="0.45" stroke="#00e676" stroke-width="2" stroke-dasharray="6,4" />
    <rect x="0" y="0" width="140" height="40" rx="8" fill="#004d40" stroke="#4db6ac" stroke-width="1" />
    <text x="70" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="2">
      BAHAR
    </text>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#80cbc4">
      Payout 2.00x
    </text>

    <!-- Bahar Card Stack -->
    <g transform="translate(30, 85)" filter="url(#cardShadow)">
      <rect width="80" height="110" rx="6" fill="url(#cardBack)" stroke="#ffc107" stroke-width="1" />
      <rect x="6" y="6" width="68" height="98" rx="4" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="2,2" />
      <circle cx="40" cy="55" r="16" fill="#7f0000" stroke="#ffc107" stroke-width="0.75" />
      <text x="40" y="60" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#ffc107">B</text>
    </g>
  </g>

  <!-- Center Spotlight: JOKER MATCH CARD (King of Hearts / Royal Ace) -->
  <g transform="translate(335, 145)" filter="url(#cardShadow)">
    <!-- Spotlight Aura -->
    <circle cx="65" cy="90" r="110" fill="#ffd54f" fill-opacity="0.18" filter="url(#goldGlow)" />
    
    <!-- Outer Golden Frame of Joker Box -->
    <rect x="-12" y="-35" width="154" height="255" rx="16" fill="#000000" fill-opacity="0.75" stroke="url(#goldLuxury)" stroke-width="2" />
    
    <!-- Joker Box Header -->
    <rect x="0" y="-25" width="130" height="26" rx="6" fill="url(#goldLuxury)" />
    <text x="65" y="-8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#1b1202" letter-spacing="1.5">
      ★ JOKER CARD ★
    </text>

    <!-- The Joker Card (King of Hearts) -->
    <g transform="translate(10, 10)">
      <rect width="110" height="160" rx="8" fill="url(#cardFront)" stroke="#dddddd" stroke-width="1" />
      
      <!-- Top Left Card Index -->
      <text x="12" y="24" font-family="serif" font-size="20" font-weight="900" fill="#d50000">K</text>
      <text x="12" y="42" font-size="16" fill="#d50000">♥</text>

      <!-- Center Big Heart Symbol & King Crown -->
      <g transform="translate(55, 80)">
        <text x="0" y="-18" text-anchor="middle" font-size="28">👑</text>
        <text x="0" y="22" text-anchor="middle" font-size="44" fill="#d50000" filter="url(#goldGlow)">♥</text>
      </g>

      <!-- Bottom Right Card Index Inverted -->
      <g transform="translate(98, 148) rotate(180)">
        <text x="0" y="0" font-family="serif" font-size="20" font-weight="900" fill="#d50000">K</text>
        <text x="0" y="16" font-size="16" fill="#d50000">♥</text>
      </g>
    </g>

    <text x="65" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffd54f">
      MATCH TO WIN
    </text>
  </g>

  <!-- Golden Chips Stack -->
  <g transform="translate(235, 340)" filter="url(#cardShadow)">
    <ellipse cx="0" cy="18" rx="34" ry="12" fill="#d50000" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5,3" />
    <ellipse cx="0" cy="9" rx="34" ry="12" fill="#0091ea" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5,3" />
    <ellipse cx="0" cy="0" rx="34" ry="12" fill="url(#chipGold)" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,3" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" fill-opacity="0.2" />
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">₹500</text>
  </g>

  <g transform="translate(565, 340)" filter="url(#cardShadow)">
    <ellipse cx="0" cy="18" rx="34" ry="12" fill="#2e7d32" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5,3" />
    <ellipse cx="0" cy="9" rx="34" ry="12" fill="#6a1b9a" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5,3" />
    <ellipse cx="0" cy="0" rx="34" ry="12" fill="url(#chipGold)" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,3" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" fill-opacity="0.2" />
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">₹1000</text>
  </g>

  <!-- Header Title & Badges -->
  <g transform="translate(60, 75)">
    <rect x="0" y="-22" width="130" height="28" rx="14" fill="#00e676" fill-opacity="0.2" stroke="#00e676" stroke-width="1.5" />
    <circle cx="14" cy="-8" r="4" fill="#00e676" filter="url(#goldGlow)" />
    <text x="26" y="-4" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1">
      LIVE CASINO
    </text>

    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="0.5">
      ANDAR BAHAR
    </text>
    <text x="0" y="56" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#a5d6a7">
      TRADITIONAL INDIAN CASINO • INSTANT PAYOUT
    </text>
  </g>

  <!-- Right Top 2.0x Badge -->
  <g transform="translate(620, 65)">
    <rect x="0" y="0" width="120" height="42" rx="10" fill="url(#goldLuxury)" stroke="#ffffff" stroke-width="1" filter="url(#cardShadow)" />
    <text x="60" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#1b1202">
      2.0X PAYOUT
    </text>
  </g>
</svg>
